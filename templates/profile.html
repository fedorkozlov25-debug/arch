<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        /* Современные футуристичные стили */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1e38 100%); /* Глубокий темный градиент */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        /* Карточка в стиле стеклянного морфизма */
        .card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        /* Заголовки */
        .card h2 {
            text-align: center;
            margin: 0 0 25px 0;
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .card h3 {
            margin: 30px 0 15px 0;
            color: #f1f5f9;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        /* Профиль пользователя (Строки данных) */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #334155;
        }
        .row:last-of-type { border-bottom: none; margin-bottom: 10px; }
        
        .label { 
            color: #94a3b8; 
            font-size: 14px;
            font-weight: 500;
        }
        
        .value { 
            color: #ffffff; 
            font-weight: 600;
            font-size: 15px;
        }

        /* Кнопки общего интерфейса */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 15px;
            transition: all 0.25s ease;
        }
        
        .btn-primary { 
            background: linear-gradient(90deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }
        .btn-primary:hover { 
            background: linear-gradient(90deg, #0ea5e9 0%, #0284c7 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
        }
        .btn-primary:active { transform: translateY(1px); }

        .btn-danger { 
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #fca5a5;
            margin-top: 25px;
        }
        .btn-danger:hover { 
            background: rgba(220, 53, 69, 0.8);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }

        /* Окно сообщений чата */
        #chat-messages {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        /* Кастомный скроллбар для чата */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Элементы сообщений */
        .msg {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 80%;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
            box-sizing: border-box;
        }
        
        .msg.user {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(29, 78, 216, 0.25);
        }
        
        .msg.bot { 
            background-color: #1e293b; 
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Поле ввода сообщения */
        #chat-input {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            box-sizing: border-box;
            resize: none;
            min-height: 60px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.4;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        #chat-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        #chat-input::placeholder {
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Личный кабинет</h2>

        <div class="row"><span class="label">Баланс</span><span class="value">{{ user.balance }}</span></div>
        <div class="row"><span class="label">Имя</span><span class="value">{{ user.username }}</span></div>
        <div class="row"><span class="label">Email</span><span class="value">{{ user.email }}</span></div>

        <a href="/transactions" class="btn btn-primary">Транзакции</a>

        <h3>Чат с нейронкой</h3>
        <div id="chat-messages"></div>
        <form id="chat-form">
            <textarea id="chat-input" placeholder="Ваше сообщение..." required></textarea>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>

        <form action="/logout" method="post">
            <button type="submit" class="btn btn-danger">Выйти</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js"
            integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../static/script.js"></script>
</body>
</html>
