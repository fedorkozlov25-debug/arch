<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница авторизации</title>
    <style>
        /* Современные стили интерфейса */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1e38 100%); /* Глубокий темный градиент */
            display: flex;
            justify-content: center; 
            align-items: center;     
            height: 100vh;           
            margin: 0;
        }

        /* Карточка в стиле стеклянного морфизма */
        .login-card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 35px;
            border-radius: 16px;     
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }

        /* Заголовок */
        .login-card h2 {
            text-align: center;
            margin: 0 0 30px 0;
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Поля ввода */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8; /* Спокойный серый */
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.25s ease;
            box-sizing: border-box; 
        }

        .form-group input:focus {
            outline: none;
            border-color: #38bdf8; /* Неоново-голубой фокус */
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        /* Плейсхолдеры */
        .form-group input::placeholder {
            color: #475569;
        }

        /* Кнопка */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
            background: linear-gradient(90deg, #0ea5e9 0%, #0284c7 100%);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Ссылка переключения */
        .switch-link {
            text-align: center;
            margin-top: 25px;
        }

        .switch-link a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .switch-link a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Вход в систему</h2>
        <form method="post" id="login-form">
            <div class="form-group">
                <label for="username">Логин или Email</label>
                <input type="text" id="username" name="username" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <div class="switch-link">
            <a href="/">Зарегистрироваться</a>
        </div>
    </div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../static/script.js"></script>
</html>
